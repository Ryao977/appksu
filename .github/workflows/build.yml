name: build-module
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Android NDK r27c (mirror first, official fallback)
        run: |
          if ! wget -q --timeout=90 -O ndk.zip https://mirrors.tuna.tsinghua.edu.cn/AndroidSDK/android-ndk-r27c-linux.zip; then
            echo "mirror failed, trying official..."
            wget -q --timeout=180 -O ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          fi
          [ -s ndk.zip ] || { echo "NDK download failed"; exit 1; }
          unzip -q ndk.zip
          ls -d android-ndk-* >/dev/null || { echo "ndk dir missing"; exit 1; }
          echo "NDK_DIR=$PWD/$(ls -d android-ndk-*) " >> "$GITHUB_ENV"
      - name: Locate project root (zip upload / extra folder layer tolerated)
        run: |
          set -e
          echo "--- repo root ---"
          ls -la
          if [ -f build.sh ]; then
            echo "ROOT_DIR=." >> "$GITHUB_ENV"
          elif [ -f anti_device_flag_ksu/build.sh ]; then
            echo "ROOT_DIR=anti_device_flag_ksu" >> "$GITHUB_ENV"
          else
            mkdir -p unzip_root
            for z in *.zip; do
              [ -f "$z" ] && { echo "unpacking $z"; unzip -q "$z" -d unzip_root || true; }
            done
            BS=$(find unzip_root -name build.sh -print -quit)
            [ -n "$BS" ] || { echo "build.sh not found anywhere in repo"; exit 1; }
            echo "ROOT_DIR=$(dirname "$BS")" >> "$GITHUB_ENV"
          fi
      - name: Build module
        run: |
          cd "$ROOT_DIR"
          chmod +x build.sh customize.sh service.sh
          ./build.sh "$NDK_DIR" 2>&1 | tee /tmp/build_out.log
          cp anti_device_flag_ksu.zip "$GITHUB_WORKSPACE/" 2>/dev/null || true
      - name: Sanity check
        run: |
          unzip -l anti_device_flag_ksu.zip | grep -q "module.prop" || { echo "module.prop missing"; exit 1; }
          unzip -l anti_device_flag_ksu.zip | grep -q "libanti_device_flag_zygisk.so" || { echo "zygisk so missing"; exit 1; }
      - name: Upload module
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: anti_device_flag_ksu.zip
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: /tmp/build_out.log
          if-no-files-found: ignore
